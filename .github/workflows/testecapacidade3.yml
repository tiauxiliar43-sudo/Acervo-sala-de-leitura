name: Teste de Capacidade e Estresse

on:
  push:
    branches: [ "main", "principal" ]
  workflow_dispatch:

jobs:
  testar-capacidade:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    - name: Configurar ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Executar Simulação de Carga e Métricas
      run: |
        python3 -c "
        import os, time, sqlite3

        db_path = 'SalaDeLeitura_Portatil/banco_leitura.db'
        
        print('==========================================')
        print('INICIANDO TESTE DE CAPACIDADE E ESTRESSE')
        print('==========================================')
        
        if os.path.exists(db_path):
            tamanho_antes = os.path.getsize(db_path)
            print(f'[OK] Banco encontrado. Tamanho inicial: {tamanho_antes} bytes')
            
            conn = sqlite3.connect(db_path)
            cursor = conn.cursor()
            
            print('[INFO] Iniciando inserção de 1.000 registros válidos na tabela livros...')
            inicio = time.time()
            sucessos = 0
            erros = 0
            
            for i in range(1, 1001):
                try:
                    # Preenchendo os campos obrigatórios (titulo, autor, codigo_isbn)
                    titulo = f'Livro Teste Carga {i}'
                    autor = f'Autor Fictício {i}'
                    isbn = f'ISBN-CARGA-{i}'
                    
                    cursor.execute('''
                        INSERT INTO livros (titulo, autor, codigo_isbn, status) 
                        VALUES (?, ?, ?, 'Disponível')
                    ''', (titulo, autor, isbn))
                    sucessos += 1
                except Exception as e:
                    erros += 1
            
            conn.commit()
            fim = time.time()
            tempo_total = fim - inicio
            
            tamanho_depois = os.path.getsize(db_path)
            
            print('------------------------------------------')
            print('RELATÓRIO DE MÉTRICAS PARA O TRABALHO:')
            print(f'-> Total de tentativas: 1000')
            print(f'-> Inserções com sucesso: {sucessos}')
            print(f'-> Falhas/Erros: {erros}')
            print(f'-> Tempo total de processamento: {tempo_total:.4f} segundos')
            print(f'-> Velocidade média: {(tempo_total/1000)*1000:.2f} ms por registro')
            print(f'-> Tamanho do arquivo após teste: {tamanho_depois} bytes')
            print(f'-> Aumento no arquivo de dados: {tamanho_depois - tamanho_antes} bytes')
            print('------------------------------------------')
            
            conn.close()
        else:
            print(f'[ERRO] Banco não encontrado em {db_path}')
        "

name: Teste de Capacidade e Estresse

on:
  push:
    branches: [ "main", "principal" ]
  workflow_dispatch: # Permite rodar manualmente na aba Ações

jobs:
  testar-capacidade:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    - name: Configurar ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Executar Simulação de Carga e Métricas Avançadas
      run: |
        python3 -c "
        import os, time, sqlite3

        # Caminho corrigido para entrar na pasta correta do projeto
        db_path = 'SalaDeLeitura_Portatil/banco_leitura.db'
        
        print('==========================================')
        print('INICIANDO TESTE DE CAPACIDADE E ESTRESSE')
        print('==========================================')
        
        if os.path.exists(db_path):
            tamanho_antes = os.path.getsize(db_path)
            print(f'[OK] Banco de dados encontrado em: {db_path}')
            print(f'[MÉTRICA] Tamanho do arquivo antes do teste: {tamanho_antes} bytes')
            
            conn = sqlite3.connect(db_path)
            cursor = conn.cursor()
            
            # Descobre quais tabelas existem no banco automaticamente
            cursor.execute(\"SELECT name FROM sqlite_master WHERE type='table';\")
            tabelas = [row[0] for row in cursor.fetchall()]
            print(f'[INFO] Tabelas encontradas no banco: {tabelas}')
            
            # Seleciona a tabela de livros ou a primeira disponível
            tabela_alvo = 'livros' if 'livros' in tabelas else (tabelas[0] if tabelas else None)
            
            if tabela_alvo:
                print(f'[INFO] Usando a tabela \"{tabela_alvo}\" para o teste de carga...')
                print('[INFO] Iniciando inserção de 1.000 registros...')
                
                inicio = time.time()
                sucessos = 0
                erros = 0
                
                for i in range(1, 1001):
                    try:
                        cursor.execute(f'INSERT INTO {tabela_alvo} (titulo) VALUES (?)', (f'Livro Teste Carga {i}',))
                        sucessos += 1
                    except Exception as e:
                        erros += 1
                
                conn.commit()
                fim = time.time()
                tempo_total = fim - inicio
                
                tamanho_depois = os.path.getsize(db_path)
                
                print('------------------------------------------')
                print('RELATÓRIO DE MÉTRICAS PARA O TRABALHO:')
                print(f'-> Tabela Alvo Analisada: {tabela_alvo}')
                print(f'-> Total de tentativas: 1000')
                print(f'-> Inserções com sucesso: {sucessos}')
                print(f'-> Falhas/Erros (Debilidades): {erros}')
                print(f'-> Tempo total de processamento: {tempo_total:.4f} segundos')
                print(f'-> Velocidade média: {(tempo_total/1000)*1000:.2f} ms por registro')
                print(f'-> Tamanho do arquivo após teste: {tamanho_depois} bytes')
                print(f'-> Consumo extra gerado no disco: {tamanho_depois - tamanho_antes} bytes')
                print('------------------------------------------')
            else:
                print('[ERRO] Nenhuma tabela válida encontrada no banco de dados.')
            
            conn.close()
        else:
            print(f'[ERRO CRÍTICO] O arquivo {db_path} não foi encontrado.')
        "
